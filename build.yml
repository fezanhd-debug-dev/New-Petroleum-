name: Build Windows release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore PetroleumPumpManagement.sln

      - name: Build
        run: dotnet build PetroleumPumpManagement.sln -c Release --no-restore

      - name: Publish (self-contained, single file)
        run: dotnet publish PetroleumPump.Desktop/PetroleumPump.Desktop.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PetroPumpManager-win-x64
          path: publish/
